<!DOCTYPE html>
<html>
<head>
<style>
.box {
    width: 200px;
    padding: 20px;
    border: 5px solid black;
    box-sizing: border-box;
}
</style>
</head>
<body>

<div class="box">Border Box</div>

</body>
</html>

<!-- 
Total Width = 200px

Content Width =
200 - 40 (padding) - 10 (border)
= 150px

Here, the specified width includes content, padding, and border. 
-->
