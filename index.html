<!DOCTYPE html> <!-- Declares that this document uses HTML5 -->

<html lang="en"> <!-- Root element of the HTML page; language is English -->

<head> <!-- Contains metadata and settings for the webpage -->

    <meta charset="UTF-8">
    <!-- Sets character encoding to UTF-8, supporting most languages and symbols -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the webpage responsive on different screen sizes -->

    <title>Document</title>
    <!-- Title displayed in the browser tab -->

    <link rel="stylesheet" href="style.css">

</head>

<body> <!-- Contains all visible content of the webpage -->

    <!-- Main heading -->
    <h1>Hello, HTML</h1>

    <!-- Emmet-generated heading with placeholder text -->
    <h1>Lorem ipsum dolor sit amet consectetur.</h1>

    <!-- Examples of heading tags from largest to smallest -->
    <h1>Main Heading</h1>
    <h2>Section Heading</h2>
    <h3>Subsection Heading</h3>
    <h4>Sub-subsection Heading</h4>
    <h5>Minor Heading</h5>
    <h6>Smallest Heading</h6>

    <!-- Displays an image
         src = image path
         alt = alternative text if image fails to load
         width & height = image dimensions -->
    <img src="images/dp.png" alt="dp" width="50px" height="50px">

    <!-- External hyperlink
         title = tooltip shown on hover
         href = destination URL -->
    <a title="Google link" href="https://google.com">Google link</a>

    <!-- Line break -->
    <br>

    <!-- Internal link to another page in the same project -->
    <a href="home.html">Home Page</a>

    <!-- Unordered List (bulleted list) -->
    <ul>

        <!-- List item -->
        <li>1</li>

        <!-- List item -->
        <li>2</li>

    </ul>

    <!-- ========================= -->
    <!-- Block-Level Element Example -->
    <!-- Starts on a new line and takes full width -->
    <div>This is a div (Block level).</div>

    <!-- ========================= -->
    <!-- Inline Elements Example -->
    <!-- Inline elements stay in the same line -->

    <p>
        This is

        <!-- Inline container -->
        <span>inline text</span>.

        Visit

        <!-- Inline hyperlink -->
        <a href="#">this link</a>.

        <!-- Inline bold/important text -->
        <strong>Important!</strong>
    </p>

</body> <!-- End of the body section -->

</html> <!-- End of the HTML document -->
