<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- img -->
    <img src="images/dp.png" style="height: 300px; width: 300px;" alt="a dp">


    <!-- figure -->
    <figure>
        <img src="images/dp.png" style="height: 300px; width: 300px;" alt="a dp">
        <figcaption>A cute cat sitting on the grass.</figcaption>
    </figure>


    <!-- Video -->
    <video width="600" controls controlsList="nodownload">
        <source src="images/1780764826376.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>


    <!-- What is ARIA? -->
    <!-- ARIA stands for Accessible Rich Internet Applications. -->
    <!-- ARIA attributes help screen readers and other assistive technologies understand web elements better, making websites more accessible to users with disabilities. -->
    <button>X</button>

    <button aria-label="Close">
        X
    </button>


</body>

</html>
