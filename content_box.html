<!DOCTYPE html>
<html>
<head>
<style>
.box {
    width: 200px;
    padding: 20px;
    border: 5px solid black;
    box-sizing: content-box;
}
</style>
</head>
<body>

<div class="box">Content Box</div>

</body>
</html>

<!-- 
Content Width = 200px
Padding Left + Right = 40px
Border Left + Right = 10px

Total Width = 200 + 40 + 10 = 250px

So, when using content-box, the specified width only applies to the content area. 
-->
